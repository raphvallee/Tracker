name: Set up Flutter
description: >
  Flutter from tracker/pubspec.yaml, restored from a slimmed SDK cache, with
  the pub cache.

runs:
  using: composite
  steps:
  - name: Set up Flutter
    id: flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      flutter-version-file: tracker/pubspec.yaml
      architecture: X64
      # Also caches pub packages (keyed on pubspec.lock); flutter pub get
      # still runs every time, so a stale cache can only cost a
      # re-download, never produce a wrong build.
      cache: true
      # The SDK is cached slimmed (see the next step), under a key of its own
      # so the full SDK cache is never restored instead. Change the key's
      # prefix whenever the slimming changes, or the old cache stays in use.
      cache-key: 'flutter-slim2-:os:-:channel:-:version:-:arch:-:hash:'
  - name: Slim the Flutter SDK before it is cached
    # Only on a cache miss: the SDK was just downloaded in full (1.7 GB
    # compressed). CI only analyzes, generates code and runs Linux host
    # tests, so the rest goes: the preloaded pub packages (CI restores its
    # own pub cache), the framework's own dev, docs, engine and examples
    # sources, the Android, web and desktop-build artifacts, the web
    # compilers, DevTools and the sanitizer runtimes. impellerc stays, tests
    # compile shaders with it, and so does the SDK's utils/gen_snapshot,
    # build_runner compiles its builders with it. The git history is cut to
    # the one commit (Flutter needs the repository, its branch, upstream and
    # tag, not the history). The cache drops to about 0.26 GB, restored in
    # about 2 s. Flutter skips its weekly upstream fetch on CI, so the short
    # history is never fetched back.
    if: steps.flutter.outputs.CACHE-HIT != 'true'
    shell: bash
    run: |
      cd "$FLUTTER_ROOT"
      rm -rf .pub-preload-cache dev docs engine examples \
        bin/cache/flutter_web_sdk \
        bin/cache/artifacts/engine/android-* \
        bin/cache/artifacts/engine/linux-x64-profile \
        bin/cache/artifacts/engine/linux-x64-release \
        bin/cache/artifacts/engine/linux-x64/flutter_linux \
        bin/cache/artifacts/engine/linux-x64/libflutter_linux_gtk.so \
        bin/cache/artifacts/engine/linux-x64/gen_snapshot \
        bin/cache/artifacts/engine/linux-x64/font-subset
      (cd bin/cache/dart-sdk/bin && rm -rf *_asan *_msan *_tsan *.sym \
        utils/wasm-opt resources/devtools snapshots/dartdevc* \
        snapshots/dart2js* snapshots/dart2wasm* snapshots/dart2bytecode*)
      upstream=$(git rev-parse --symbolic-full-name '@{upstream}')
      git for-each-ref --format='%(refname)' refs/remotes | grep -vxF "$upstream" \
        | sed 's/^/delete /' | git update-ref --no-deref --stdin
      git tag --no-contains HEAD | sed 's|^|delete refs/tags/|' | git update-ref --stdin
      git rev-parse HEAD > .git/shallow
      git reflog expire --expire=now --all
      git gc --quiet --prune=now
      du -sh .

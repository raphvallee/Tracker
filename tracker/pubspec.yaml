name: tracker
description: "Cross-platform workout tracking app."
publish_to: 'none'
version: 0.0.1+2

environment:
  sdk: '>=3.13.2 <4.0.0'
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.6
  hydrated_bloc: ^11.0.0
  flutter_bloc: ^9.1.1
  window_size: ^0.2.0
  forui: ^0.27.6
  forui_lucide: ^0.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: any
  dependency_validator: any
  husky: ^0.1.7
  forui_cli: ^0.27.0

flutter:
  uses-material-design: true
